<style>body{margin:0}</style>
<div id="root"></div>
<script type="text/babel">
const DEMO_PROGRAMS = [
  { id: 'p1', title: '90-Day Business Foundations', status: 'published', coverStyle: 'gradient', seed: 0, moduleCount: 5, learnerCount: 42 },
  { id: 'p2', title: 'Copywriting for Creators', status: 'draft', coverStyle: 'gradient', seed: 1, moduleCount: 3, learnerCount: 0 },
];
function Demo() {
  const [withPrograms, setWithPrograms] = React.useState(true);
  return (
    <div>
      <div
        onClick={() => setWithPrograms((v) => !v)}
        style={{ position: 'fixed', top: 14, right: 14, zIndex: 10, fontFamily: 'var(--font-mono)', fontSize: 10.5, color: 'var(--color-text-faint)', cursor: 'pointer', background: 'var(--color-bg-elevated)', padding: '6px 10px', borderRadius: 999 }}
      >
        {withPrograms ? '(demo) show empty state' : '(demo) show programs'}
      </div>
      <window.ProgramsHome programs={withPrograms ? DEMO_PROGRAMS : []} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
